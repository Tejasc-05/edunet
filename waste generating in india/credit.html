<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waste Management Credit System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #e0f7fa 0%, #a5d6a7 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(44, 62, 80, 0.15);
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.8s;
    }
    h1 {
      color: #388e3c;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }
    form {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #388e3c;
      font-weight: 500;
      text-align: left;
    }
    input, select {
      width: 100%;
      padding: 0.7rem;
      margin-bottom: 1rem;
      border: 2px solid #a5d6a7;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    input:focus, select:focus {
      border-color: #388e3c;
      outline: none;
    }
    button {
      background: #388e3c;
      color: #fff;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #2e7031;
      transform: scale(1.05);
    }
    .result, .total {
      margin: 1rem 0;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 0.7rem;
      border-radius: 8px;
      background: #e8f5e9;
      color: #388e3c;
      opacity: 0;
      animation: fadeInResult 0.6s forwards;
    }
    .total {
      background: #c8e6c9;
      font-size: 1.3rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(56, 142, 60, 0.08);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px);}
      to { opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeInResult {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (max-width: 500px) {
      .container { padding: 1rem; }
      h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Waste Management Credit System</h1>
    <form id="wasteForm">
      <label for="wasteType">Waste Type</label>
      <select id="wasteType" required>
        <option value="">Select type</option>
        <option value="Iron">Iron</option>
        <option value="Plastic">Plastic</option>
        <option value="Normal">Normal</option>
        <option value="Other">Other</option>
      </select>
      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" min="0.1" step="0.1" required placeholder="Enter weight in kg">
      <button type="submit">Submit Waste</button>
    </form>
    <div id="result"></div>
    <div id="total"></div>
  </div>
  <script>
    // Credit rules
    const creditRules = {
      Iron: 100,
      Plastic: 30,
      Normal: 10,
      Other: 40
    };

    // Load total credits from localStorage
    let totalCredits = Number(localStorage.getItem('totalCredits')) || 0;

    // Show total credits on load
    const totalDiv = document.getElementById('total');
    function updateTotalCredits() {
      totalDiv.textContent = `Total Credits: ${totalCredits}`;
      totalDiv.style.opacity = 1;
      totalDiv.style.background = '#c8e6c9';
      totalDiv.animate([
        { background: '#c8e6c9' },
        { background: '#81c784' },
        { background: '#c8e6c9' }
      ], { duration: 600 });
    }
    updateTotalCredits();

    document.getElementById('wasteForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const type = document.getElementById('wasteType').value;
      const weight = parseFloat(document.getElementById('weight').value);

      if (!type || isNaN(weight) || weight <= 0) {
        alert('Please enter valid waste type and weight.');
        return;
      }

      const credits = Math.round(creditRules[type] * weight);
      totalCredits += credits;
      localStorage.setItem('totalCredits', totalCredits);

      // Show result with animation
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = `You earned ${credits} credits for ${weight} kg of ${type} waste!`;
      resultDiv.style.opacity = 1;
      resultDiv.style.background = '#e8f5e9';
      resultDiv.animate([
        { background: '#e8f5e9', color: '#388e3c' },
        { background: '#a5d6a7', color: '#1b5e20' },
        { background: '#e8f5e9', color: '#388e3c' }
      ], { duration: 700 });

      updateTotalCredits();

      // Reset form
      document.getElementById('wasteForm').reset();
    });
  </script>
</body>
</html>
